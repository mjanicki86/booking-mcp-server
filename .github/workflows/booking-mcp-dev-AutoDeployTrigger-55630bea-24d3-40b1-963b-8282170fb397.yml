name: Trigger auto deployment for booking-mcp-dev

on:
  push:
    branches: 
      [ main ]
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: read
    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BOOKINGMCPDEV_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BOOKINGMCPDEV_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BOOKINGMCPDEV_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy to Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          containerAppName: booking-mcp-dev
          resourceGroup: rg-containerapps-dev
          targetPort: 8080
