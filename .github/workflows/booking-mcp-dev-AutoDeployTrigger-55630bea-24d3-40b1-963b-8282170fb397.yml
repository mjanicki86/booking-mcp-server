name: Trigger auto deployment for booking-mcp-dev

# Wdrozenie na dev NIE przy kazdym pushu (testerzy pracuja na dev w ciagu dnia).
# - automatycznie codziennie o 17:05 UTC = 18:05 czasu zimowego / 19:05 letniego,
#   tylko gdy na main sa commity, ktorych jeszcze nie wdrozono (tag dev-deployed);
# - recznie w kazdej chwili: Actions -> ten workflow -> Run workflow.
on:
  schedule:
    - cron: "5 17 * * *"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: write
    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Czy sa nowe commity do wdrozenia
        id: changes
        run: |
          git fetch --tags --force
          HEAD_SHA=$(git rev-parse HEAD)
          LAST=$(git rev-parse -q --verify "refs/tags/dev-deployed^{commit}" || echo "")
          if [ "${{ github.event_name }}" = "schedule" ] && [ -z "$LAST" ]; then
            # Pierwsze uruchomienie: dev ma juz ten kod (wdrozony 29.10 przy pushu) - tylko oznaczamy.
            echo "Brak tagu dev-deployed - ustawiam go na $HEAD_SHA bez wdrazania."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "tag_only=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && git diff --quiet "$LAST" HEAD -- . ':(exclude).github'; then
            echo "Od ostatniego wdrozenia ($LAST) brak zmian w kodzie aplikacji - pomijam."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Wdrazam $HEAD_SHA (poprzednio: ${LAST:-brak})."
            git log --oneline "${LAST:+$LAST..}HEAD" | head -50
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure Login
        if: steps.changes.outputs.deploy == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BOOKINGMCPDEV_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BOOKINGMCPDEV_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BOOKINGMCPDEV_AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Container Registry
        if: steps.changes.outputs.deploy == 'true'
        uses: docker/login-action@v2
        with:
          registry: ca3eefb6ab51acr.azurecr.io
          username: ${{ secrets.BOOKINGMCPDEV_REGISTRY_USERNAME }}
          password: ${{ secrets.BOOKINGMCPDEV_REGISTRY_PASSWORD }}

      - name: Build and deploy to Container App
        if: steps.changes.outputs.deploy == 'true'
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: ca3eefb6ab51acr.azurecr.io
          registryUsername: ${{ secrets.BOOKINGMCPDEV_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BOOKINGMCPDEV_REGISTRY_PASSWORD }}
          containerAppName: booking-mcp-dev
          resourceGroup: rg-containerapps-dev
          targetPort: 8080

      - name: Oznacz wdrozony commit
        if: steps.changes.outputs.deploy == 'true' || steps.changes.outputs.tag_only == 'true'
        run: |
          git tag -f dev-deployed HEAD
          git push -f origin refs/tags/dev-deployed
